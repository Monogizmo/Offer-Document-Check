<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจไฟล์ก่อนส่งอนุมัติ</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#e3e6ea;--ok:#15803d;--okb:#dcfce7;--wn:#a16207;--wnb:#fef3c7;--er:#b91c1c;--erb:#fee2e2;--ac:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1b1e23;--tx:#ececec;--mu:#9aa1ab;--bd:#2c3037;--ok:#4ade80;--okb:#12301c;--wn:#fbbf24;--wnb:#33280a;--er:#f87171;--erb:#381414;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111316;--card:#1b1e23;--tx:#ececec;--mu:#9aa1ab;--bd:#2c3037;--ok:#4ade80;--okb:#12301c;--wn:#fbbf24;--wnb:#33280a;--er:#f87171;--erb:#381414;--ac:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.drop{border:2px dashed var(--bd);text-align:center;padding:26px 12px;cursor:pointer;border-radius:12px;background:var(--card);margin-bottom:12px}
.drop.on{border-color:var(--ac)}.drop b{display:block;font-size:16px}.drop span{color:var(--mu);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
input[type=number],select{padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=number]{width:70px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fn{word-break:break-all;font-size:14px}.sub{color:var(--mu);font-size:13px;margin-top:2px;word-break:break-word}
.pill{flex:none;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.wn{background:var(--wnb);color:var(--wn)}.pill.er{background:var(--erb);color:var(--er)}
details{margin-top:6px;font-size:13px}summary{cursor:pointer;color:var(--ac)}
.chk{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--bd)}.chk small{display:block;color:var(--mu)}
.chk .t{flex:none;font-weight:700;width:16px}.chk.ok .t{color:var(--ok)}.chk.wn .t{color:var(--wn)}.chk.er .t{color:var(--er)}
button{font:inherit;padding:9px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button:disabled{opacity:.5}
.hide{display:none}#sum{font-weight:600;margin:4px 0 10px;font-size:14px}
</style>
</head>
<body>
<main>
<h1>ตรวจไฟล์ก่อนส่งอนุมัติ</h1>
<p class="s">เลือกหลายไฟล์พร้อมกันได้ ระบบตรวจทุกไฟล์ แล้วแก้ทั้งหมดในครั้งเดียว ไฟล์ไม่ถูกอัปโหลดออกนอกเครื่อง</p>

<div class="card"><div class="row">
  <label>ขนาดสูงสุด (MB)</label><input type="number" id="lim" value="10" min="1">
  <label><input type="checkbox" id="b64" checked> คิดแบบ base64 (+33%)</label>
</div>
<div class="row" style="margin-top:8px"><label>PDF ที่ไม่ได้มาจาก Word</label>
<select id="pm"><option value="raster">แปลงเป็นภาพ (เหมือนแปะใน Word)</option><option value="clean">สร้างใหม่แบบเก็บข้อความ</option></select></div>
<p class="s" style="margin:8px 0 0;font-size:12px">ลิมิตเป็นค่าสมมติ ปรับให้ตรงกับของจริงใน flow</p></div>

<div class="drop" id="drop"><b>แตะเพื่อเลือกไฟล์ (เลือกได้หลายไฟล์) หรือลากมาวาง</b><span>PDF, Word, Excel, รูปภาพ</span>
<input type="file" id="f" class="hide" multiple></div>

<div id="sum"></div>
<div class="row" style="margin-bottom:10px">
  <button id="fixall" class="hide"></button>
  <button id="zip" class="hide g">ดาวน์โหลดไฟล์พร้อมส่งทั้งหมด (ZIP)</button>
  <button id="clr" class="hide g">ล้างรายการ</button>
</div>
<div id="list"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const ALLOWED=['pdf','doc','docx','xls','xlsx','png','jpg','jpeg'],IMG=['png','jpg','jpeg'];
const STEPS=[[2,.8],[1.5,.7],[1.2,.55],[1.0,.4],[0.8,.3]];
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let items=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const limBytes=()=>($('lim').value||10)*1048576,eff=s=>$('b64').checked?s*1.34:s;
const mb=b=>(b/1048576).toFixed(2)+' MB',ext=n=>(n.split('.').pop()||'').toLowerCase();

function safeName(n){
  const e=n.includes('.')?ext(n):'';
  let base=n.includes('.')?n.slice(0,n.lastIndexOf('.')):n;
  base=base.normalize('NFKD').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').replace(/^[_.-]+|[_.-]+$/g,'').slice(0,60);
  if(!base){const d=new Date(),p=x=>String(x).padStart(2,'0');base='document_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())}
  return base+'.'+(e||'pdf');
}

async function analyze(file){
  const r=[];const add=(s,t,d)=>r.push({s,t,d});const e=ext(file.name);
  if(!file.name.includes('.'))add('er','ชื่อไฟล์ไม่มีนามสกุล');
  else if(!ALLOWED.includes(e))add('er','ชนิดไฟล์ .'+e+' ไม่รองรับ','รองรับ: '+ALLOWED.join(', '));
  else add('ok','ชนิดไฟล์ .'+e+' รองรับ');
  if(/[^A-Za-z0-9._-]/.test(file.name))add('er','ชื่อไฟล์มีอักษรไทย ช่องว่าง หรืออักขระพิเศษ');
  else if(file.name.length>100)add('er','ชื่อไฟล์ยาวเกิน 100 ตัวอักษร');
  else add('ok','ชื่อไฟล์ปลอดภัย');
  const es=eff(file.size);
  if(file.size===0)add('er','ไฟล์ว่าง (0 ไบต์)');
  else if(es>limBytes())add('er','ไฟล์ใหญ่เกินลิมิต','จริง '+mb(file.size)+' / คำนวณ '+mb(es));
  else add('ok','ขนาดผ่าน','จริง '+mb(file.size)+' / คำนวณ '+mb(es));
  let pdfBad=false,enc=false,word=false;
  if(e==='pdf'&&file.size>0){
    const buf=await file.arrayBuffer();const head=new TextDecoder().decode(buf.slice(0,1024));
    if(!head.includes('%PDF')){add('er','โครงสร้าง PDF ผิดปกติ','ไม่พบส่วนหัว %PDF');pdfBad=true}
    else{
      try{
        const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
        add('ok','เปิด PDF ได้ปกติ',pdf.numPages+' หน้า');
        try{const inf=(await pdf.getMetadata()).info||{};word=/microsoft/i.test((inf.Producer||'')+' '+(inf.Creator||''));
          const raw=new TextDecoder('latin1').decode(buf);const ver=(head.match(/%PDF-(\d\.\d)/)||[])[1]||'?';const fl=[];
          if(/\/Sig\b/.test(raw))fl.push('ลายเซ็นดิจิทัล');if(/\/AcroForm/.test(raw))fl.push('ฟอร์ม');if(/\/XFA/.test(raw))fl.push('XFA');
          if(/\/EmbeddedFile/.test(raw))fl.push('ไฟล์แนบฝัง');if(/\/JavaScript|\/JS\b/.test(raw))fl.push('JavaScript');
          if(/\/Encrypt/.test(raw)){fl.push('เข้ารหัส/จำกัดสิทธิ์');enc=true}
          add(word?'ok':'wn','PDF '+ver+' | Producer: '+(inf.Producer||'-')+' | Creator: '+(inf.Creator||'-'),(word?'สร้างจาก Microsoft':'ไม่ได้สร้างจาก Microsoft')+(fl.length?' | พบ: '+fl.join(', '):''));
        }catch(_){}
      }catch(x){pdfBad=true;add('er',x&&x.name==='PasswordException'?'PDF มีรหัสผ่าน ต้องปลดล็อกก่อน':'เปิด PDF ไม่ได้ ไฟล์อาจเสียหาย')}
    }
  }
  if(['doc','docx','xls','xlsx'].includes(e))add('wn','ไฟล์ Office ตรวจได้แค่ชื่อ ชนิด และขนาด');
  return {r,pdfBad,enc,word,e,sizeBad:es>limBytes(),nameBad:/[^A-Za-z0-9._-]/.test(file.name)||file.name.length>100||!file.name.includes('.')};
}

function plan(it){
  const a=it.a,pdf=a.e==='pdf'&&!a.pdfBad;let mode=null;
  if(pdf&&(!a.word||a.sizeBad||a.enc))mode=($('pm').value==='clean'&&!a.sizeBad&&!a.enc)?'clean':'raster';
  else if(IMG.includes(a.e)&&a.sizeBad)mode='raster';
  else if(a.nameBad&&ALLOWED.includes(a.e))mode='name';
  it.mode=mode;
  it.state=!mode?(a.r.some(x=>x.s==='er')?'er':'ok'):'fix';
}
function assignNames(){
  const used=new Set();
  items.forEach(it=>{
    let n=it.mode?safeName(it.file.name):it.file.name;
    if(it.mode==='raster'||it.mode==='clean')n=n.replace(/\.[^.]+$/,'')+'.pdf';
    const base=n;let i=2;
    while(used.has(n.toLowerCase())){n=base.replace(/(\.[^.]+)$/,'_'+i+'$1');i++}
    used.add(n.toLowerCase());it.name=n;
  });
}

async function pdfFromPdf(buf,scale,q,cb){
  const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;let doc;
  for(let i=1;i<=pdf.numPages;i++){
    cb('หน้า '+i+'/'+pdf.numPages);
    const p=await pdf.getPage(i),v1=p.getViewport({scale:1}),v=p.getViewport({scale});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
    const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
    await p.render({canvasContext:cx,viewport:v}).promise;
    const img=c.toDataURL('image/jpeg',q),o=v1.width>v1.height?'l':'p';
    if(i===1)doc=new jspdf.jsPDF({unit:'pt',format:[v1.width,v1.height],orientation:o});else doc.addPage([v1.width,v1.height],o);
    doc.addImage(img,'JPEG',0,0,v1.width,v1.height);
  }
  return doc.output('blob');
}
async function pdfFromImage(file,q){
  const url=URL.createObjectURL(file),im=new Image();
  await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url});
  const k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  const s=Math.min(595/c.width,842/c.height),dw=c.width*s,dh=c.height*s,doc=new jspdf.jsPDF({unit:'pt',format:'a4'});
  doc.addImage(c.toDataURL('image/jpeg',q),'JPEG',(595-dw)/2,(842-dh)/2,dw,dh);
  return doc.output('blob');
}

async function fixOne(it){
  it.busy=true;it.msg='';render();
  try{
    let blob=it.file;const a=it.a;
    if(it.mode==='clean'){
      const src=await PDFLib.PDFDocument.load(await it.file.arrayBuffer(),{ignoreEncryption:true});
      const out=await PDFLib.PDFDocument.create();
      (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
      out.setProducer('');out.setCreator('');blob=new Blob([await out.save()],{type:'application/pdf'});
    }else if(it.mode==='raster'){
      const buf=a.e==='pdf'?await it.file.arrayBuffer():null;
      for(const [s,q] of STEPS){
        blob=a.e==='pdf'?await pdfFromPdf(buf,s,q,t=>{it.prog=t;render()}):await pdfFromImage(it.file,q);
        if(eff(blob.size)<=limBytes())break;
      }
    }
    it.out=new File([blob],it.name,{type:blob.type||it.file.type});
    const a2=await analyze(it.out),bad=a2.r.filter(x=>x.s==='er');
    it.state=bad.length?'er':'fixed';it.msg=bad.map(x=>x.t).join(', ');
  }catch(x){it.state='er';it.msg='แก้ไม่สำเร็จ: '+(x.message||x)}
  it.busy=false;it.prog='';render();
}

const LBL={checking:['wn','กำลังตรวจ...'],ok:['ok','พร้อมส่ง'],fix:['wn','ต้องแก้'],fixed:['ok','แก้แล้ว พร้อมส่ง'],er:['er','แก้อัตโนมัติไม่ได้']};
const MT={raster:'แปลงเป็นภาพ + สร้าง PDF ใหม่',clean:'สร้าง PDF ใหม่ (เก็บข้อความ)',name:'เปลี่ยนชื่อไฟล์'};
function card(it,i){
  let [c,t]=LBL[it.state];if(it.busy)t='กำลังแก้...';
  let sub=mb(it.file.size);
  if(it.state==='fix')sub+=' · จะทำ: '+MT[it.mode]+' → '+it.name;
  if(it.state==='fixed')sub+=' → '+it.out.name+' ('+mb(it.out.size)+')';
  if(it.state==='er'&&!it.msg&&it.a)sub+=' · '+it.a.r.filter(x=>x.s==='er').map(x=>x.t).join(', ');
  if(it.msg)sub+=' · '+it.msg;if(it.prog)sub+=' · '+it.prog;
  const det=it.a?'<details><summary>รายละเอียดการตรวจ</summary>'+it.a.r.map(x=>'<div class="chk '+x.s+'"><span class="t">'+({ok:'✓',wn:'!',er:'✕'})[x.s]+'</span><div>'+esc(x.t)+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div></div>').join('')+'</details>':'';
  let btn='';
  if(it.state==='fix')btn='<button data-act="fix" data-i="'+i+'"'+(it.busy?' disabled':'')+'>แก้ไฟล์นี้</button>';
  if(it.state==='fixed'||it.state==='ok')btn='<button class="g" data-act="dl" data-i="'+i+'">ดาวน์โหลด</button>';
  return '<div class="card"><div class="top"><b class="fn">'+esc(it.file.name)+'</b><span class="pill '+c+'">'+t+'</span></div><div class="sub">'+esc(sub)+'</div>'+det+(btn?'<div class="row" style="margin-top:8px">'+btn+'</div>':'')+'</div>';
}
function render(){
  $('list').innerHTML=items.map(card).join('');
  const n=s=>items.filter(i=>i.state===s).length,nfix=n('fix'),nready=n('ok')+n('fixed');
  $('sum').textContent=items.length?('ทั้งหมด '+items.length+' ไฟล์ · พร้อมส่ง '+nready+' · ต้องแก้ '+nfix+' · แก้อัตโนมัติไม่ได้ '+n('er')):'';
  $('fixall').classList.toggle('hide',!nfix);$('fixall').textContent='แก้ทั้งหมด ('+nfix+' ไฟล์)';
  $('fixall').disabled=items.some(i=>i.busy);
  $('zip').classList.toggle('hide',nready<1);$('clr').classList.toggle('hide',!items.length);
}
function save(file){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}

async function add(files){
  const news=[...files].map(f=>({file:f,state:'checking'}));items.push(...news);render();
  for(const it of news){try{it.a=await analyze(it.file);plan(it)}catch(x){it.state='er';it.msg='ตรวจไม่สำเร็จ: '+(x.message||x)}}
  assignNames();render();
}
async function reanalyze(){
  for(const it of items){if(it.busy)continue;it.out=null;it.msg='';it.state='checking';render();
    try{it.a=await analyze(it.file);plan(it)}catch(x){it.state='er'}}
  assignNames();render();
}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const it=items[b.dataset.i];
  if(b.dataset.act==='fix')fixOne(it);if(b.dataset.act==='dl')save(it.out||it.file)};
$('fixall').onclick=async()=>{for(const it of items.filter(i=>i.state==='fix'))await fixOne(it)};
$('zip').onclick=async()=>{
  const z=new JSZip();items.filter(i=>i.state==='ok'||i.state==='fixed').forEach(i=>{const f=i.out||i.file;z.file(f.name,f)});
  const blob=await z.generateAsync({type:'blob'});save(new File([blob],'ready_files.zip'));
};
$('clr').onclick=()=>{items=[];render()};
const d=$('drop'),inp=$('f');
d.onclick=()=>inp.click();
inp.onchange=()=>{if(inp.files.length)add(inp.files);inp.value=''};
['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('on')}));
['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('on')}));
d.addEventListener('drop',e=>{if(e.dataTransfer.files.length)add(e.dataTransfer.files)});
['lim','b64','pm'].forEach(id=>$(id).onchange=()=>items.length&&reanalyze());
</script>
</body>
</html>
